         real SSR/prerendering, which is out of scope for now. -->

    <meta property="og:site_name" content="StageAdvance" />
    <meta property="og:title" content="StageAdvance — input lists, mic pulls, stand counts" />

    <meta property="og:image:height" content="630" />
